name: Release

# Push a tag equal to the manifest version (e.g. 0.1.0, no "v") to publish a
# release with the files Obsidian and a manual install need.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Manual install: unzip icloud-drive-sync-$GITHUB_REF_NAME.zip into your vault's .obsidian/plugins/ folder. See the README." \
            main.js manifest.json styles.css "dist/icloud-drive-sync-$GITHUB_REF_NAME.zip"
